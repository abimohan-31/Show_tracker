<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShowTrackr | Modern Show Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav>
        <a href="index.html" class="logo">Show<span>Trackr</span></a>
        <div class="nav-actions">
            <div class="search-container">
                <input type="text" id="searchBox" placeholder="Search shows...">
                <button id="clearSearch" class="btn-clear-search" title="Clear search">×</button>
            </div>
            <a href="add.html" class="btn-add">Add Show</a>
        </div>
    </nav>

    <section class="controls">
        <div class="filter-group">
            <div class="btn-row" id="typeBar">
                <button class="type-btn active" data-filter="All">All Shows</button>
                <button class="type-btn" data-filter="Movie">Movies</button>
                <button class="type-btn" data-filter="Series">Series</button>
            </div>
            <div class="btn-row" id="alphabetBar">
                <button class="alph-btn active" data-filter="All">All</button>
                <button class="alph-btn" data-filter="0-9">0-9</button>
            </div>
            <div class="btn-row" id="genreBar">
                <button class="genre-btn active" data-filter="All">All Genres</button>
            </div>
            <button id="clearFilters" class="btn-clear-filters">Clear All Filters</button>
        </div>
    </section>

    <main class="movie-grid" id="movieGrid">
        <!-- Movies will be rendered here -->
    </main>

    <script src="js/data.js"></script>
    <script src="js/home.js"></script>

</body>
</html>
