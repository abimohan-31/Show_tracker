<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ShowTrackr</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav>
        <a href="index.html" class="logo">Show<span>Trackr</span></a>
    </nav>

    <main class="form-container" style="max-width: 450px;">
        <h2 class="form-title">Welcome Back</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" class="form-control" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Sign In</button>
            <p style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary); font-size: 0.9rem;">
                Don't have an account? <a href="signup.html" style="color: var(--accent-red); text-decoration: none;">Create one</a>
            </p>
        </form>
    </main>

    <script>
        document.getElementById('loginForm').onsubmit = (e) => {
            e.preventDefault();
            alert('Selection and Authentication logic is simulated in this version.');
            window.location.href = 'index.html';
        };
    </script>

</body>
</html>
