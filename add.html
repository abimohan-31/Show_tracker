<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Show | ShowTrackr</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav>
        <a href="index.html" class="logo">Show<span>Trackr</span></a>
        <div class="nav-actions">
            <a href="index.html" class="btn-add" style="background: transparent; border: 1px solid var(--accent-red); color: var(--accent-red);">Back to Home</a>
        </div>
    </nav>

    <main class="form-container">
        <h2 class="form-title">Add New Show</h2>
        <form id="addForm">
            <div class="form-group">
                <label>Show Title</label>
                <input type="text" id="inTitle" class="form-control" placeholder="e.g. Inception" required>
            </div>
            
            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div>
                    <label>Show Type</label>
                    <select id="inType" class="form-control" required>
                        <option value="Movie">Movie</option>
                        <option value="Series">Series</option>
                    </select>
                </div>
                <div>
                    <label>Watch Status</label>
                    <select id="inStatus" class="form-control" required>
                        <option value="Planned">Planned</option>
                        <option value="Watching">Watching</option>
                        <option value="Watched">Watched</option>
                    </select>
                </div>
            </div>

            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div>
                    <label>Release Year</label>
                    <input type="number" id="inYear" class="form-control" value="2025" required>
                </div>
                <div>
                    <label>Rating (1-10)</label>
                    <input type="number" id="inRating" class="form-control" step="0.1" min="0" max="10" value="8.0" required>
                </div>
            </div>

            <div class="form-group">
                <label>Main Genre</label>
                <input type="text" id="inGenres" class="form-control" placeholder="e.g. Action, Sci-Fi" required>
            </div>

            <div class="form-group">
                <label>Poster Image URL</label>
                <input type="url" id="inImg" class="form-control" placeholder="https://..." required>
            </div>
            <div class="form-group">
                <label>Overall Moral / Description</label>
                <textarea id="inMoral" class="form-control" rows="4" placeholder="What is the key takeaway?" required></textarea>
            </div>
            <button type="submit" class="btn-submit">Save to Collection</button>
        </form>
    </main>

    <script src="js/data.js"></script>
    <script src="js/add.js"></script>

</body>
</html>
